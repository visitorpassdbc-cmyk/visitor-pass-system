<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Division User — VisitorPass System</title>
  <meta name="description" content="Submit and track visitor entry requests" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .request-card {
      border-left: 3px solid var(--accent-primary);
      margin-bottom: 12px;
      padding: 16px 20px;
      background: var(--bg-card);
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      border-left: 3px solid var(--accent-primary);
      transition: var(--transition);
    }
    .request-card:hover {
      border-color: var(--glass-border-hover);
      border-left-color: var(--accent-primary);
      transform: translateX(3px);
    }
    .request-card.approved { border-left-color: var(--success); }
    .request-card.rejected { border-left-color: var(--danger); }
    .request-card.pending_admin { border-left-color: var(--info); }
    .request-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .request-id {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-light);
      font-weight: 600;
    }
    .request-visitor {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .request-meta {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .request-meta span { display: flex; align-items: center; gap: 4px; }
    .qr-modal-content {
      text-align: center;
    }
    .qr-pass-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin: 16px 0;
      color: #1a1a2e;
    }
    .qr-pass-card h3 {
      font-size: 14px;
      font-weight: 700;
      color: #6d28d9;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .qr-pass-card .visitor-name-qr {
      font-size: 20px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 12px;
    }
    #qrcode-display {
      display: flex;
      justify-content: center;
      margin: 16px 0;
    }
    .pass-details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      text-align: left;
      margin-top: 12px;
      border-top: 1px solid #e2e8f0;
      padding-top: 12px;
    }
    .pass-detail-item label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      font-weight: 600;
    }
    .pass-detail-item p {
      font-size: 12px;
      font-weight: 600;
      color: #1e293b;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-content">
      <div id="page-content"></div>
    </main>
  </div>
  <!-- Modal: New Request -->
  <div class="modal-overlay" id="new-request-modal">
    <div class="modal" style="max-width:640px">
      <div class="modal-header">
        <h2 class="modal-title">➕ New Visitor Request</h2>
        <button class="modal-close" onclick="closeModal('new-request-modal')">✕</button>
      </div>
      <form id="visitor-form" onsubmit="handleSubmitRequest(event)">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Visitor Full Name *</label>
            <input type="text" class="form-control" id="f-name" placeholder="e.g. John Doe" required />
          </div>
          <div class="form-group">
            <label class="form-label">NIC / Passport No. *</label>
            <input type="text" class="form-control" id="f-nic" placeholder="e.g. 123456789V" required />
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="tel" class="form-control" id="f-phone" placeholder="e.g. 0771234567" required />
          </div>
          <div class="form-group">
            <label class="form-label">Company / Organization</label>
            <input type="text" class="form-control" id="f-company" placeholder="e.g. ABC Pvt Ltd" />
          </div>
          <div class="form-group">
            <label class="form-label">Host Name (Meeting With) *</label>
            <input type="text" class="form-control" id="f-host" placeholder="e.g. Mr. Silva" required />
          </div>
          <div class="form-group">
            <label class="form-label">Department *</label>
            <select class="form-control" id="f-dept" required>
              <option value="">Select Department</option>
              <option value="CPD(MTV)">CPD(MTV)</option>
              <option value="Digital">Digital</option>
              <option value="IT Division">IT Division</option>
              <option value="Legends FM">Legends FM</option>
              <option value="M&E">M&E</option>
              <option value="Admin">Admin</option>
              <option value="MBC CPD">MBC CPD</option>
              <option value="MBC Engineering">MBC Engineering</option>
              <option value="MBC Finance">MBC Finance</option>
              <option value="MBC Library">MBC Library</option>
              <option value="MBC Scheduling">MBC Scheduling</option>
              <option value="Mekup Room">Mekup Room</option>
              <option value="MTV Dubbing">MTV Dubbing</option>
              <option value="MTV Engineering">MTV Engineering</option>
              <option value="MTV Library">MTV Library</option>
              <option value="MTV Maintenance">MTV Maintenance</option>
              <option value="MTV MCR">MTV MCR</option>
              <option value="Shakthi FM">Shakthi FM</option>
              <option value="Shakthi TV">Shakthi TV</option>
              <option value="Sirasa FM">Sirasa FM</option>
              <option value="Y FM">Y FM</option>
              <option value="Yes FM">Yes FM</option>
              <option value="Subtitle division">Subtitle division</option>
              <option value="TX Room">TX Room</option>
              <option value="TV1">TV1</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Visit Date *</label>
            <input type="date" class="form-control" id="f-date" required />
          </div>
          <div class="form-group">
            <label class="form-label">Visit Time *</label>
            <input type="time" class="form-control" id="f-time" required />
          </div>
          <div class="form-group full-width">
            <label class="form-label">Purpose of Visit *</label>
            <textarea class="form-control" id="f-purpose" rows="3" placeholder="Describe the purpose of this visit..." required></textarea>
          </div>
          <div class="form-group full-width">
            <label class="form-label">Additional Notes</label>
            <textarea class="form-control" id="f-notes" rows="2" placeholder="Any additional information..."></textarea>
          </div>
          <div class="form-group full-width" style="margin-top:16px; border-top:1px solid var(--glass-border); padding-top:16px;">
            <h3 style="font-size:14px; margin-bottom:12px; color:var(--text-secondary)">👥 Group Members (Additional Visitors)</h3>
            <div id="additional-visitors-container" style="display:flex; flex-direction:column; gap:12px; margin-bottom:12px;"></div>
            <button type="button" class="btn btn-outline btn-sm" onclick="addGroupMemberRow()">➕ Add Group Member</button>
          </div>
        </div>
        <div style="display:flex;gap:12px;margin-top:20px;justify-content:flex-end">
          <button type="button" class="btn btn-outline" onclick="closeModal('new-request-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">🚀 Submit Request</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Modal: View QR Pass -->
  <div class="modal-overlay" id="qr-modal">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h2 class="modal-title">🎫 Visitor Pass</h2>
        <button class="modal-close" onclick="closeModal('qr-modal')">✕</button>
      </div>
      <div class="qr-modal-content">
        <div class="qr-pass-card" id="qr-pass-card">
          <h3>🏢 Official Visitor Pass</h3>
          <div class="visitor-name-qr" id="qr-visitor-name">—</div>
          <div id="qrcode-display"></div>
          <div class="pass-details-grid" id="qr-pass-details"></div>
        </div>
        <p style="font-size:12px;color:var(--text-muted);margin:8px 0 16px">
          Share this QR pass with the visitor. Security will scan it at the gate.
        </p>
        <div style="display:flex;gap:10px;justify-content:center">
          <button class="btn btn-outline btn-sm" onclick="printPass()">🖨️ Print Pass</button>
          <button class="btn btn-primary btn-sm" onclick="downloadPass()">⬇️ Download</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentUser = VPS.requireAuth(['division']);
    let currentFilter = 'all';
    let searchQuery = '';
    let editRequestId = null;
    VPS.renderSidebar('dashboard');
    // Set min date to today
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('f-date').min = today;
    function renderPage() {
      const records = VPS.filter({ submittedBy: currentUser.id, search: searchQuery });
      const filtered = currentFilter === 'all' ? records : records.filter(r => r.status === currentFilter);
      const total = records.length;
      const pending = records.filter(r => r.status === VPS.STATUS.PENDING_HOD || r.status === VPS.STATUS.PENDING_ADMIN).length;
      const approved = records.filter(r => r.status === VPS.STATUS.APPROVED).length;
      const rejected = records.filter(r => r.status === VPS.STATUS.REJECTED).length;
      document.getElementById('page-content').innerHTML = `
        <div class="page-header fade-in">
          <h1>My Visitor Requests</h1>
          <p>Welcome back, ${currentUser.name} · ${currentUser.department} Division</p>
        </div>
        <div class="stats-grid fade-in fade-in-delay-1">
          <div class="stat-card">
            <div class="stat-icon">📋</div>
            <div class="stat-value">${total}</div>
            <div class="stat-label">Total Requests</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">⏳</div>
            <div class="stat-value">${pending}</div>
            <div class="stat-label">Pending</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-value">${approved}</div>
            <div class="stat-label">Approved</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">❌</div>
            <div class="stat-value">${rejected}</div>
            <div class="stat-label">Rejected</div>
          </div>
        </div>
        <div class="card fade-in fade-in-delay-2">
          <div class="card-header">
            <span class="card-title">📋 Visitor Requests</span>
            <button class="btn btn-primary btn-sm" onclick="openNewRequestModal()">➕ New Request</button>
          </div>
          <div class="filter-bar">
            <div class="search-input">
              <input type="text" placeholder="Search by name, NIC, purpose..." id="search-input"
                oninput="searchQuery=this.value; renderPage()" value="${searchQuery}" />
            </div>
            <select class="form-control" style="width:auto" onchange="currentFilter=this.value; renderPage()" id="status-filter">
              <option value="all" ${currentFilter==='all'?'selected':''}>All Status</option>
              <option value="pending_hod" ${currentFilter==='pending_hod'?'selected':''}>Pending HOD</option>
              <option value="pending_admin" ${currentFilter==='pending_admin'?'selected':''}>Pending Admin</option>
              <option value="approved" ${currentFilter==='approved'?'selected':''}>Approved</option>
              <option value="rejected" ${currentFilter==='rejected'?'selected':''}>Rejected</option>
            </select>
          </div>
          <div id="requests-list">
            ${filtered.length === 0
              ? `<div class="empty-state"><div class="empty-icon">📭</div><h3>No requests found</h3><p>Click "New Request" to submit your first visitor request.</p></div>`
              : filtered.map(r => renderRequestCard(r)).join('')
            }
          </div>
        </div>
      `;
    }
    function renderRequestCard(r) {
      const statusClass = r.status === VPS.STATUS.APPROVED ? 'approved' : r.status === VPS.STATUS.REJECTED ? 'rejected' : (r.status === VPS.STATUS.PENDING_ADMIN || r.status === VPS.STATUS.PENDING_HOD) ? 'pending_admin' : '';
      const isPending = r.status === VPS.STATUS.PENDING_HOD || r.status === VPS.STATUS.PENDING_ADMIN;
      return `
        <div class="request-card ${statusClass}">
          <div class="request-header">
            <div>
              <div class="request-id">${r.id}</div>
              <div class="request-visitor">${r.visitorName}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
              ${VPS.statusBadge(r.status)}
              ${isPending ? `
                <button class="btn btn-outline btn-sm" onclick="editRequest('${r.id}')" style="border-color:var(--accent-primary);color:var(--accent-light);padding:4px 8px;font-size:11px">✏️ Edit</button>
                <button class="btn btn-outline btn-sm" onclick="deleteRequest('${r.id}')" style="background:rgba(239,68,68,0.05);color:var(--danger);border-color:rgba(239,68,68,0.2);padding:4px 8px;font-size:11px">🗑️ Delete</button>
              ` : ''}
              ${r.status === VPS.STATUS.APPROVED ? `<button class="btn btn-success btn-sm" onclick="viewQR('${r.id}')">🎫 View Pass</button>` : ''}
            </div>
          </div>
          <div class="request-meta">
            <span>🪪 ${r.visitorNIC}</span>
            <span>📞 ${r.visitorPhone}</span>
            <span>🏢 ${r.department}</span>
            <span>👤 Host: ${r.hostName}</span>
            <span>📅 ${r.visitDate} ${r.visitTime}</span>
            <span>💬 ${r.purpose}</span>
          </div>
          ${r.hodApproval?.action === 'rejected' ? `<div style="margin-top:8px;font-size:12px;color:var(--danger)">❌ HOD Rejected: ${r.hodApproval.comment}</div>` : ''}
          ${r.adminApproval?.action === 'rejected' ? `<div style="margin-top:8px;font-size:12px;color:var(--danger)">❌ Admin Rejected: ${r.adminApproval.notes}</div>` : ''}
        </div>
      `;
    }
    let groupMemberCount = 0;
    function addGroupMemberRow() {
      groupMemberCount++;
      const container = document.getElementById('additional-visitors-container');
      const row = document.createElement('div');
      row.className = 'form-grid cols-3';
      row.id = `member-row-${groupMemberCount}`;
      row.style.background = 'rgba(255,255,255,0.02)';
      row.style.padding = '12px';
      row.style.borderRadius = 'var(--radius-sm)';
      row.style.border = '1px dashed var(--glass-border)';
      row.style.position = 'relative';
      row.style.marginTop = '8px';
      row.style.animation = 'fadeIn 0.3s ease';
      
      row.innerHTML = `
        <div class="form-group">
          <label class="form-label">Member Full Name *</label>
          <input type="text" class="form-control member-name" placeholder="Member name" required />
        </div>
        <div class="form-group">
          <label class="form-label">NIC / Passport</label>
          <input type="text" class="form-control member-nic" placeholder="NIC number" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <div style="display:flex; gap:8px">
            <input type="tel" class="form-control member-phone" placeholder="Phone number" style="flex:1" />
            <button type="button" class="btn btn-danger btn-sm" style="padding:10px" onclick="removeGroupMemberRow(${groupMemberCount})">✕</button>
          </div>
        </div>
      `;
      container.appendChild(row);
    }
    
    function removeGroupMemberRow(id) {
      const row = document.getElementById(`member-row-${id}`);
      if (row) row.remove();
    }

    window.addGroupMemberRow = addGroupMemberRow;
    window.removeGroupMemberRow = removeGroupMemberRow;

    function openNewRequestModal() {
      editRequestId = null;
      document.getElementById('visitor-form').reset();
      document.getElementById('additional-visitors-container').innerHTML = '';
      groupMemberCount = 0;
      document.querySelector('#new-request-modal .modal-title').textContent = '➕ New Visitor Request';
      document.querySelector('#new-request-modal button[type="submit"]').textContent = 'Submit Request';
      openModal('new-request-modal');
    }

    function editRequest(id) {
      const r = VPS.getById(id);
      if (!r) return;
      editRequestId = id;
      
      document.getElementById('f-name').value = r.visitorName || '';
      document.getElementById('f-nic').value = r.visitorNIC || '';
      document.getElementById('f-phone').value = r.visitorPhone || '';
      document.getElementById('f-company').value = r.company || '';
      document.getElementById('f-host').value = r.hostName || '';
      document.getElementById('f-dept').value = r.department || 'General';
      document.getElementById('f-date').value = r.visitDate || '';
      document.getElementById('f-time').value = r.visitTime || '';
      document.getElementById('f-purpose').value = r.purpose || '';
      document.getElementById('f-notes').value = r.notes || '';
      
      const container = document.getElementById('additional-visitors-container');
      container.innerHTML = '';
      groupMemberCount = 0;
      if (r.groupMembers && r.groupMembers.length > 0) {
        r.groupMembers.forEach(m => {
          addGroupMemberRow();
          const row = document.getElementById(`member-row-${groupMemberCount}`);
          if (row) {
            row.querySelector('.member-name').value = m.name || '';
            row.querySelector('.member-nic').value = m.nic || '';
            row.querySelector('.member-phone').value = m.phone || '';
          }
        });
      }
      
      document.querySelector('#new-request-modal .modal-title').textContent = '✏️ Edit Visitor Request';
      document.querySelector('#new-request-modal button[type="submit"]').textContent = 'Update Request';
      openModal('new-request-modal');
    }

    function deleteRequest(id) {
      if (confirm('Are you sure you want to delete this request? This action cannot be undone.')) {
        VPS.deleteRequest(id);
        renderPage();
        VPS.showNotification('Visitor request deleted.', 'warning');
      }
    }

    window.openNewRequestModal = openNewRequestModal;
    window.editRequest = editRequest;
    window.deleteRequest = deleteRequest;

    function handleSubmitRequest(e) {
      e.preventDefault();
      
      const groupMembers = [];
      const rows = document.querySelectorAll('#additional-visitors-container > div');
      rows.forEach(row => {
        const name = row.querySelector('.member-name').value.trim();
        const nic = row.querySelector('.member-nic').value.trim();
        const phone = row.querySelector('.member-phone').value.trim();
        if (name) {
          groupMembers.push({ name, nic, phone });
        }
      });

      const data = {
        visitorName: document.getElementById('f-name').value.trim(),
        visitorNIC: document.getElementById('f-nic').value.trim(),
        visitorPhone: document.getElementById('f-phone').value.trim(),
        company: document.getElementById('f-company').value.trim(),
        hostName: document.getElementById('f-host').value.trim(),
        department: document.getElementById('f-dept').value,
        visitDate: document.getElementById('f-date').value,
        visitTime: document.getElementById('f-time').value,
        purpose: document.getElementById('f-purpose').value.trim(),
        notes: document.getElementById('f-notes').value.trim(),
        groupMembers: groupMembers
      };
      
      if (editRequestId) {
        // Reset approval state if edited
        const existing = VPS.getById(editRequestId);
        if (existing) {
          const appCfg = VPS.getApprovalConfig();
          let nextStatus = VPS.STATUS.PENDING_HOD;
          if (!appCfg.hodRequired) {
            nextStatus = appCfg.adminRequired ? VPS.STATUS.PENDING_ADMIN : VPS.STATUS.APPROVED;
          }
          data.status = nextStatus;
          data.hodApproval = null;
          data.adminApproval = null;
        }
        VPS.updateRequest(editRequestId, data);
        VPS.showNotification('Visitor request updated!', 'success');
        editRequestId = null;
      } else {
        VPS.addRequest(data, currentUser);
        VPS.showNotification('Visitor request submitted!', 'success');
      }
      
      closeModal('new-request-modal');
      document.getElementById('visitor-form').reset();
      document.getElementById('additional-visitors-container').innerHTML = '';
      groupMemberCount = 0;
      
      document.querySelector('#new-request-modal .modal-title').textContent = '➕ New Visitor Request';
      document.querySelector('#new-request-modal button[type="submit"]').textContent = 'Submit Request';
      
      renderPage();
    }
    function viewQR(id) {
      const rec = VPS.getById(id);
      if (!rec || !rec.qrData) return;
      document.getElementById('qr-visitor-name').textContent = rec.visitorName;
      document.getElementById('qr-pass-details').innerHTML = `
        <div class="pass-detail-item"><label>Pass ID</label><p>${rec.id}</p></div>
        <div class="pass-detail-item"><label>NIC</label><p>${rec.visitorNIC}</p></div>
        <div class="pass-detail-item"><label>Purpose</label><p>${rec.purpose}</p></div>
        <div class="pass-detail-item"><label>Host</label><p>${rec.hostName}</p></div>
        <div class="pass-detail-item"><label>Department</label><p>${rec.department}</p></div>
        <div class="pass-detail-item"><label>Visit Date</label><p>${rec.visitDate} ${rec.visitTime}</p></div>
        <div class="pass-detail-item"><label>Approved By</label><p>${rec.adminApproval?.byName || rec.hodApproval?.byName || 'Approver'}</p></div>
        ${rec.groupMembers && rec.groupMembers.length > 0 ? `
          <div class="pass-detail-item" style="grid-column: span 2; border-top: 1px dashed #e2e8f0; padding-top: 8px; margin-top: 8px;">
            <label style="color:#6d28d9; font-weight:700">Group Members (${rec.groupMembers.length})</label>
            <div style="font-size: 11px; margin-top: 4px; display:flex; flex-direction:column; gap:4px">
              ${rec.groupMembers.map((m, idx) => `
                <div style="color:#1e293b"><strong>${idx+1}. ${m.name}</strong> ${m.nic ? `(NIC: ${m.nic})` : ''}</div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;
      openModal('qr-modal');
      document.getElementById('qrcode-display').innerHTML = '';
      const verificationUrl = `${window.location.origin}${window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'))}/verify.html?scan=${rec.id}`;
      if (typeof QRCode !== 'undefined') {
        new QRCode(document.getElementById('qrcode-display'), {
          text: verificationUrl,
          width: 180,
          height: 180,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M,
        });
      }
    }
    function printPass() {
      const el = document.getElementById('qr-pass-card');
      const w = window.open('', '_blank');
      w.document.write(`<html><head><title>Visitor Pass</title><style>
        body{font-family:Inter,sans-serif;margin:20px;color:#1a1a2e}
        h3{color:#6d28d9;text-transform:uppercase;letter-spacing:1px;font-size:12px}
        .vn{font-size:22px;font-weight:800;margin:8px 0}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;border-top:1px solid #e2e8f0;padding-top:12px}
        label{font-size:9px;text-transform:uppercase;color:#94a3b8;letter-spacing:0.5px}
        p{font-size:12px;font-weight:600;color:#1e293b;margin:0}
        #qrcode-display canvas { display: none !important; }
        #qrcode-display img { display: block !important; margin: 12px auto; }
      </style></head><body>${el.innerHTML}</body></html>`);
      w.document.close();
      setTimeout(() => { w.focus(); w.print(); }, 500);
    }
    function downloadPass() {
      const passCard = document.getElementById('qr-pass-card');
      const visitorName = document.getElementById('qr-visitor-name').textContent;
      const qrDisplay = document.getElementById('qrcode-display');
      
      // Get the QR code image (QRCode.js generates both canvas and img)
      const qrImg = qrDisplay.querySelector('img') || qrDisplay.querySelector('canvas');
      if (!qrImg) {
        VPS.showNotification('QR code not ready yet. Please wait.', 'warning');
        return;
      }

      // Create a high-quality canvas for the pass card
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const scale = 2; // Retina quality
      const width = 400;
      const height = 580;
      canvas.width = width * scale;
      canvas.height = height * scale;
      ctx.scale(scale, scale);

      // Background
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(0, 0, width, height, 16);
      ctx.fill();

      // Purple header bar
      const grad = ctx.createLinearGradient(0, 0, width, 60);
      grad.addColorStop(0, '#8b5cf6');
      grad.addColorStop(1, '#6d28d9');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(0, 0, width, 60, [16, 16, 0, 0]);
      ctx.fill();

      // Header text
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px Inter, sans-serif';
      ctx.letterSpacing = '1px';
      ctx.textAlign = 'center';
      ctx.fillText('🏢  OFFICIAL VISITOR PASS', width / 2, 36);

      // Visitor name
      ctx.fillStyle = '#1a1a2e';
      ctx.font = 'bold 20px Inter, sans-serif';
      ctx.fillText(visitorName, width / 2, 95);

      // Draw QR code image
      const qrSize = 160;
      const qrX = (width - qrSize) / 2;
      const qrY = 115;
      try {
        if (qrImg.tagName === 'CANVAS') {
          ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
        } else {
          const tempImg = new Image();
          tempImg.crossOrigin = 'anonymous';
          tempImg.src = qrImg.src;
          ctx.drawImage(tempImg, qrX, qrY, qrSize, qrSize);
        }
      } catch(e) {
        // Fallback: draw placeholder
        ctx.strokeStyle = '#e2e8f0';
        ctx.strokeRect(qrX, qrY, qrSize, qrSize);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px Inter, sans-serif';
        ctx.fillText('QR Code', width / 2, qrY + qrSize / 2);
      }

      // Divider line
      const detailsStartY = qrY + qrSize + 20;
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(24, detailsStartY);
      ctx.lineTo(width - 24, detailsStartY);
      ctx.stroke();

      // Extract pass details from the rendered DOM
      const detailItems = passCard.querySelectorAll('.pass-detail-item');
      let dy = detailsStartY + 20;
      const colWidth = (width - 48) / 2;

      detailItems.forEach((item, idx) => {
        const label = item.querySelector('label')?.textContent || '';
        const value = item.querySelector('p')?.textContent || '';
        const isFullWidth = item.style.gridColumn?.includes('span 2');
        
        if (isFullWidth) {
          // Full width item (group members)
          ctx.fillStyle = '#6d28d9';
          ctx.font = 'bold 9px Inter, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(label.toUpperCase(), 24, dy);
          dy += 14;
          ctx.fillStyle = '#1e293b';
          ctx.font = '11px Inter, sans-serif';
          // Wrap text for group members
          const lines = value.split(/\d+\.\s/).filter(Boolean);
          lines.forEach(line => {
            ctx.fillText(line.trim(), 32, dy);
            dy += 14;
          });
          dy += 4;
        } else {
          const col = idx % 2;
          const x = 24 + (col * colWidth);
          
          if (col === 0 && idx > 0) dy += 4;

          ctx.fillStyle = '#94a3b8';
          ctx.font = '600 8px Inter, sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(label.toUpperCase(), x, dy);

          ctx.fillStyle = '#1e293b';
          ctx.font = '600 11px Inter, sans-serif';
          ctx.fillText(value, x, dy + 13);

          if (col === 1) dy += 30;
        }
      });

      // Footer
      ctx.fillStyle = '#94a3b8';
      ctx.font = '9px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Generated by VisitorPass System • ' + new Date().toLocaleDateString(), width / 2, height - 16);

      // Border
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(0, 0, width, height, 16);
      ctx.stroke();

      // Trigger download
      const link = document.createElement('a');
      link.download = `VisitorPass_${visitorName.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0,10)}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      
      VPS.showNotification('✅ Visitor Pass downloaded as PNG!', 'success');
    }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    // Close modal on overlay click (ignoring click when user is selecting/dragging text)
    document.querySelectorAll('.modal-overlay').forEach(el => {
      let isOverlayClick = false;
      el.addEventListener('mousedown', e => {
        isOverlayClick = (e.target === el);
      });
      el.addEventListener('click', e => {
        if (e.target === el && isOverlayClick) {
          el.classList.remove('active');
        }
      });
    });
    // Sidebar navigation click mapping
    document.addEventListener('click', function(e) {
      const navItem = e.target.closest('.nav-item');
      if (navItem && navItem.getAttribute('href').startsWith('#')) {
        e.preventDefault();
        const tab = navItem.getAttribute('href').slice(1);
        if (tab === 'new-request') {
          openModal('new-request-modal');
        } else if (tab === 'my-requests') {
          currentFilter = 'all';
          renderPage();
        } else if (tab === 'approved') {
          currentFilter = 'approved';
          renderPage();
        } else if (tab === 'dashboard') {
          currentFilter = 'all';
          renderPage();
        }
      }
    });
    // Update active class in sidebar based on currentFilter
    function updateSidebarActive() {
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      let activeId = 'nav-dashboard';
      if (currentFilter === 'approved') activeId = 'nav-approved';
      else if (currentFilter === 'all') activeId = 'nav-my-requests';
      const activeEl = document.getElementById(activeId);
      if (activeEl) activeEl.classList.add('active');
    }
    
    // Call updateSidebarActive inside renderPage
    const originalRenderPage = renderPage;
    renderPage = function() {
      originalRenderPage();
      updateSidebarActive();
    };
    renderPage();
    // Real-time data sync listener
    window.addEventListener('vps-data-updated', () => {
      console.log('Real-time database sync: refreshing page content');
      renderPage();
    });
  </script>
