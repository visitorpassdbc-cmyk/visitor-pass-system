<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Approver Login — VisitorPass System</title>
  <meta name="description" content="Secure approver login portal for HODs, Admin Directors, and Security" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
      animation: fadeIn 0.5s ease;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo .logo-circle {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 14px;
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
    }
    .login-logo h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #f1f5f9, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-logo p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      padding: 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(139, 92, 246, 0.1);
    }
    .login-card h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 20px;
      color: var(--text-primary);
    }
    .input-group {
      position: relative;
      margin-bottom: 16px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .input-group .prefix {
      position: absolute;
      left: 12px;
      bottom: 11px;
      font-size: 16px;
      pointer-events: none;
    }
    .input-group input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: var(--transition);
    }
    .input-group input:focus {
      border-color: var(--accent-primary);
      background: rgba(139, 92, 246, 0.05);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: var(--transition);
      font-family: 'Inter', sans-serif;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.4);
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(139, 92, 246, 0.5);
    }
    .error-msg {
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--danger);
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div style="margin-bottom:16px;text-align:center">
      <a href="index.html" class="btn btn-outline btn-sm" style="font-size:12px">← Back to Visitor Pass Request (පොදු පිටුවට)</a>
    </div>
    <div class="login-logo">
      <div class="logo-circle">🔐</div>
      <h1>Approver Portal</h1>
      <p>HOD, Admin Director & Security Sign In</p>
    </div>
    <div class="login-card">
      <h2>Sign In to Approve Passes</h2>
      <div class="error-msg" id="error-msg">⚠️ Invalid username or password. Please try again.</div>
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="username">Username</label>
          <span class="prefix">👤</span>
          <input type="text" id="username" placeholder="e.g. hod_it, director" autocomplete="username" required />
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <span class="prefix">🔒</span>
          <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-login">Sign In →</button>
      </form>
      <div style="margin-top:20px;text-align:center;font-size:12px;color:var(--text-muted)">
        Need an account? Contact your IT Administrator.
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="js/app.js"></script>
  <script>
    const user = VPS.getCurrentUser();
    if (user) redirectByRole(user.role);

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      const loginBtn = document.querySelector('.btn-login');

      // 1. Try Backend REST API first
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        if (res.ok) {
          const data = await res.json();
          if (data.token && data.user) {
            localStorage.setItem('vps_token', data.token);
            localStorage.setItem('vps_session', JSON.stringify(data.user));
            redirectByRole(data.user.role);
            return;
          }
        }
      } catch (err) {
        // Backend not reachable, fallback to client VPS
      }

      // 2. Client-side fallback check
      const localUser = VPS.login(username, password);
      if (localUser) {
        redirectByRole(localUser.role);
        return;
      }

      // 3. Cloud login fallback
      if (VPS.isFirebaseEnabled()) {
        loginBtn.disabled = true;
        loginBtn.textContent = '⏳ Verifying...';
        const cloudUser = await VPS.loginWithCloud(username, password);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In →';
        if (cloudUser) {
          redirectByRole(cloudUser.role);
          return;
        }
      }

      errorEl.style.display = 'block';
      document.getElementById('password').value = '';
    }

    function redirectByRole(role) {
      const routes = {
        division: 'division-user.html',
        hod: 'hod.html',
        admin: 'admin-director.html',
        itadmin: 'user-management.html',
        security: 'security.html',
      };
      window.location.href = routes[role] || 'index.html';
    }
  </script>
</body>
</html>
