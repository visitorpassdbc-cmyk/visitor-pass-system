<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Director Dashboard — VisitorPass System</title>
  <meta name="description" content="Final approval dashboard for Admin Director" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    .request-row-actions {
      display: flex;
      gap: 8px;
    }
    .qr-preview-box {
      background: white;
      padding: 16px;
      border-radius: var(--radius-md);
      display: inline-block;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-content">
      <div id="page-content"></div>
    </main>
  </div>
  <!-- Modal: Approve & Generate QR -->
  <div class="modal-overlay" id="approve-modal">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h2 class="modal-title">✅ Final Approval & QR Generation</h2>
        <button class="modal-close" onclick="closeModal('approve-modal')">✕</button>
      </div>
      <form id="approve-form" onsubmit="handleApproveSubmit(event)">
        <input type="hidden" id="approve-id" />
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">
          Approving this request will automatically generate a secure QR Pass. The pass will be sent back to the division user who requested it.
        </p>
        <div id="approve-details" style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;border-bottom:1px solid var(--glass-border);padding-bottom:16px;max-height:160px;overflow-y:auto"></div>
        <div class="form-group" style="margin-bottom:16px">
          <label class="form-label">Approval Notes (Optional)</label>
          <textarea class="form-control" id="approve-comment" rows="3" placeholder="Enter notes or special instructions for security/gate..."></textarea>
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end">
          <button type="button" class="btn btn-outline" onclick="closeModal('approve-modal')">Cancel</button>
          <button type="submit" class="btn btn-success">Final Approve & Create QR</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Modal: Reject Request -->
  <div class="modal-overlay" id="reject-modal">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h2 class="modal-title">❌ Reject Request</h2>
        <button class="modal-close" onclick="closeModal('reject-modal')">✕</button>
      </div>
      <form id="reject-form" onsubmit="handleRejectSubmit(event)">
        <input type="hidden" id="reject-id" />
        <div id="reject-details" style="font-size:12px;color:var(--text-secondary);margin-bottom:16px;border-bottom:1px solid var(--glass-border);padding-bottom:16px;max-height:160px;overflow-y:auto"></div>
        <div class="form-group" style="margin-bottom:16px">
          <label class="form-label">Reason for Rejection *</label>
          <textarea class="form-control" id="reject-comment" rows="3" placeholder="Provide a reason for rejection..." required></textarea>
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end">
          <button type="button" class="btn btn-outline" onclick="closeModal('reject-modal')">Cancel</button>
          <button type="submit" class="btn btn-danger">Reject Request</button>
        </div>
      </form>
    </div>
  </div>
  <!-- Modal: View QR Pass Details -->
  <div class="modal-overlay" id="view-qr-modal">
    <div class="modal" style="max-width:460px; text-align:center">
      <div class="modal-header">
        <h2 class="modal-title" style="text-align:left">🎫 Secure QR Pass details</h2>
        <button class="modal-close" onclick="closeModal('view-qr-modal')">✕</button>
      </div>
      <div class="qr-preview-box" id="qrcode-display"></div>
      <div id="qr-visitor-details" style="text-align:left; margin-top:16px"></div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentUser = VPS.requireAuth(['admin']);
    let currentFilter = 'pending_admin';
    let searchQuery = '';
    let selectedDeptFilter = '';

    function getDepartmentsList() {
      return VPS.DIVISIONS || [];
    }

    VPS.renderSidebar('dashboard');
    renderPage();

    // Pull any new passes from backend
    VPS.syncWithBackend().then(() => {
      renderPage();
    });
    function renderPage() {
      // Re-render sidebar to get correct badge counts
      VPS.renderSidebar(currentFilter === 'pending_admin' ? 'pending' : currentFilter === 'approved' ? 'approved' : currentFilter === 'all' ? 'all' : 'dashboard');
      
      let records = VPS.filter({ search: searchQuery });
      if (selectedDeptFilter) {
        records = records.filter(r => r.department === selectedDeptFilter);
      }
      let filtered = [];
      if (currentFilter === 'pending_admin') {
        filtered = records.filter(r => r.status === VPS.STATUS.PENDING_ADMIN);
      } else if (currentFilter === 'approved') {
        filtered = records.filter(r => r.status === VPS.STATUS.APPROVED);
      } else {
        filtered = records; // All records (includes HOD pending and rejected)
      }
      const total = records.length;
      const pendingCount = records.filter(r => r.status === VPS.STATUS.PENDING_ADMIN).length;
      const approvedCount = records.filter(r => r.status === VPS.STATUS.APPROVED).length;
      document.getElementById('page-content').innerHTML = `
        <div class="page-header fade-in">
          <h1>Director Admin Dashboard</h1>
          <p>Welcome back, ${currentUser.name} · Admin Director (Final Approver)</p>
        </div>
        <div class="stats-grid fade-in fade-in-delay-1">
          <div class="stat-card" style="cursor:pointer" onclick="changeFilter('pending_admin')">
            <div class="stat-icon">⏳</div>
            <div class="stat-value">${pendingCount}</div>
            <div class="stat-label">Pending Final Approval</div>
          </div>
          <div class="stat-card" style="cursor:pointer" onclick="changeFilter('approved')">
            <div class="stat-icon">✅</div>
            <div class="stat-value">${approvedCount}</div>
            <div class="stat-label">Total Passes Issued</div>
          </div>
          <div class="stat-card" style="cursor:pointer" onclick="changeFilter('all')">
            <div class="stat-icon">📊</div>
            <div class="stat-value">${total}</div>
            <div class="stat-label">Overall Request Logs</div>
          </div>
        </div>
        <div class="card fade-in fade-in-delay-2">
          <div class="card-header">
            <span class="card-title">📋 ${getViewTitle()}</span>
          </div>
          <div class="filter-bar" style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
            <div class="search-input" style="flex:1; min-width:200px">
              <input type="text" placeholder="Search by visitor name, department, ID..." id="search-input"
                oninput="searchQuery=this.value; renderPage()" value="${searchQuery}" />
            </div>
            <div class="filter-group">
              <select class="form-control" style="background:#111126; color:var(--text-primary); border:1px solid var(--glass-border); padding:8px 12px; border-radius:var(--radius-sm); font-size:13px; height:auto; width:auto"
                onchange="selectedDeptFilter=this.value; renderPage()">
                <option value="">All Departments</option>
                ${getDepartmentsList().map(dept => `<option value="${dept}" ${selectedDeptFilter === dept ? 'selected' : ''}>${dept}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="table-wrapper">
            ${filtered.length === 0
              ? `<div class="empty-state"><div class="empty-icon">📭</div><h3>No records found</h3><p>There are no visitor requests matching this category.</p></div>`
              : `<table>
                  <thead>
                    <tr>
                      <th>Pass ID</th>
                      <th>Visitor Name</th>
                      <th>NIC</th>
                      <th>Department</th>
                      <th>Host</th>
                      <th>HOD Approval</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${filtered.map(r => `
                      <tr>
                        <td>${r.id}</td>
                        <td>
                          <strong>${r.visitorName}</strong>
                          ${r.groupMembers && r.groupMembers.length > 0 ? `<span class="badge" style="background:rgba(139,92,246,0.15);color:var(--accent-light);font-size:10px;padding:2px 6px;margin-left:6px;border:1px solid rgba(139,92,246,0.3)">+${r.groupMembers.length} group</span>` : ''}
                          <div style="font-size:11px;color:var(--text-muted)">Phone: ${r.visitorPhone}</div>
                        </td>
                        <td>${r.visitorNIC}</td>
                        <td>${r.department}</td>
                        <td>${r.hostName}</td>
                        <td>
                          <div style="font-size:12px;color:var(--success);font-weight:600">Approved</div>
                          <div style="font-size:11px;color:var(--text-muted)">"${r.hodApproval?.comment || 'No comment'}"</div>
                        </td>
                        <td>${VPS.statusBadge(r.status)}</td>
                        <td>
                          ${r.status === VPS.STATUS.PENDING_ADMIN 
                            ? `<div class="request-row-actions">
                                 <button class="btn btn-success btn-sm" onclick="openApproveModal('${r.id}')">Approve & QR</button>
                                 <button class="btn btn-danger btn-sm" onclick="openRejectModal('${r.id}')">Reject</button>
                               </div>`
                            : r.status === VPS.STATUS.APPROVED
                            ? `<button class="btn btn-outline btn-sm" onclick="viewQR('${r.id}')">🔍 View Pass</button>`
                            : `<span style="font-size:11px;color:var(--text-muted)">Completed</span>`
                          }
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>`
            }
          </div>
        </div>
      `;
      // Synchronize active classes on the sidebar links
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeNavId = currentFilter === 'pending_admin' ? 'nav-pending' : currentFilter === 'approved' ? 'nav-approved' : currentFilter === 'all' ? 'nav-all' : 'nav-dashboard';
      const activeNav = document.getElementById(activeNavId);
      if (activeNav) activeNav.classList.add('active');
    }
    function getViewTitle() {
      if (currentFilter === 'pending_admin') return 'Awaiting Director Final Approval';
      if (currentFilter === 'approved') return 'Approved & QR Passes Issued';
      if (currentFilter === 'all') return 'All Visitor Log Records';
      return 'Visitor Records';
    }
    function changeFilter(filterName) {
      currentFilter = filterName;
      renderPage();
    }
    // Modal forms handling
    function makeRequestSummaryHTML(rec) {
      return `
        <div style="background:rgba(255,255,255,0.03); padding:10px; border-radius:6px; border:1px solid var(--glass-border); margin-bottom:12px">
          <div style="display:flex; justify-content:space-between; margin-bottom:4px">
            <span style="font-weight:700; color:var(--text-primary)">${rec.visitorName}</span>
            <span style="font-family:monospace; color:var(--accent-light); font-size:11px">${rec.id}</span>
          </div>
          <div style="font-size:11px; color:var(--text-muted); margin-bottom:6px">
            NIC: ${rec.visitorNIC} | Company: ${rec.company || 'Individual'} | Host: ${rec.hostName} | Submitted By: ${rec.submittedByName || 'Requester'}
          </div>
          <div style="font-size:11px; color:var(--text-secondary); margin-bottom:6px">
            <strong>Purpose:</strong> ${rec.purpose}
          </div>
          ${rec.groupMembers && rec.groupMembers.length > 0 ? `
            <div style="margin-top:8px; border-top:1px dashed var(--glass-border); padding-top:8px">
              <span style="font-weight:600; color:var(--warning)">👥 Group Members (${rec.groupMembers.length}):</span>
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px; display:flex; flex-direction:column; gap:2px">
                ${rec.groupMembers.map((m, idx) => `<div>${idx+1}. ${m.name} ${m.nic ? `(NIC: ${m.nic})` : ''}</div>`).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function openApproveModal(id) {
      const rec = VPS.getById(id);
      document.getElementById('approve-id').value = id;
      document.getElementById('approve-comment').value = '';
      document.getElementById('approve-details').innerHTML = rec ? makeRequestSummaryHTML(rec) : '';
      openModal('approve-modal');
    }
    function handleApproveSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('approve-id').value;
      const notes = document.getElementById('approve-comment').value.trim();
      VPS.adminApprove(id, notes, currentUser);
      closeModal('approve-modal');
      renderPage();
      VPS.showNotification('Visitor request approved! QR code generated and sent to requester.', 'success');
      setTimeout(() => {
        viewQR(id);
      }, 300);
    }
    function openRejectModal(id) {
      const rec = VPS.getById(id);
      document.getElementById('reject-id').value = id;
      document.getElementById('reject-comment').value = '';
      document.getElementById('reject-details').innerHTML = rec ? makeRequestSummaryHTML(rec) : '';
      openModal('reject-modal');
    }
    function handleRejectSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('reject-id').value;
      const comment = document.getElementById('reject-comment').value.trim();
      VPS.adminReject(id, comment, currentUser);
      closeModal('reject-modal');
      renderPage();
      VPS.showNotification('Request has been rejected.', 'warning');
    }
    function viewQR(id) {
      const rec = VPS.getById(id);
      if (!rec || !rec.qrData) return;
      
      document.getElementById('qrcode-display').innerHTML = '';
      document.getElementById('qr-visitor-details').innerHTML = `
        <div class="detail-row"><span class="detail-label">Pass ID</span><span class="detail-value">${rec.id}</span></div>
        <div class="detail-row"><span class="detail-label">Visitor</span><span class="detail-value">${rec.visitorName}</span></div>
        <div class="detail-row"><span class="detail-label">NIC</span><span class="detail-value">${rec.visitorNIC}</span></div>
        <div class="detail-row"><span class="detail-label">Purpose</span><span class="detail-value">${rec.purpose}</span></div>
        <div class="detail-row"><span class="detail-label">Department</span><span class="detail-value">${rec.department}</span></div>
        <div class="detail-row"><span class="detail-label">Visit Date</span><span class="detail-value">${rec.visitDate} ${rec.visitTime}</span></div>
        <div class="detail-row"><span class="detail-label">Submitted By</span><span class="detail-value">${rec.submittedByName || 'Requester'}</span></div>
        ${rec.groupMembers && rec.groupMembers.length > 0 ? `
          <div class="pass-detail-item" style="grid-column: span 2; border-top: 1px dashed #e2e8f0; padding-top: 8px; margin-top: 8px; text-align: left">
            <label style="font-size:9px; text-transform:uppercase; color:#6d28d9; font-weight:700; display:block; margin-bottom:4px">Group Members (${rec.groupMembers.length})</label>
            <div style="font-size: 11px; display:flex; flex-direction:column; gap:4px">
              ${rec.groupMembers.map((m, idx) => `
                <div style="color:var(--text-secondary)"><strong>${idx+1}. ${m.name}</strong> ${m.nic ? `(NIC: ${m.nic})` : ''}</div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;
      openModal('view-qr-modal');
      const verificationUrl = `${window.location.origin}${window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'))}/verify.html?scan=${rec.id}`;
      if (typeof QRCode !== 'undefined') {
        new QRCode(document.getElementById('qrcode-display'), {
          text: verificationUrl,
          width: 160,
          height: 160,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M,
        });
      }
    }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    // Click events mapping for SPA nav items
    document.addEventListener('click', function(e) {
      const navItem = e.target.closest('.nav-item');
      if (navItem && navItem.getAttribute('href').startsWith('#')) {
        e.preventDefault();
        const tab = navItem.getAttribute('href').slice(1);
        if (tab === 'pending') changeFilter('pending_admin');
        if (tab === 'approved') changeFilter('approved');
        if (tab === 'all') changeFilter('all');
      }
    });
    // Real-time data sync listener
    window.addEventListener('vps-data-updated', () => {
      console.log('Real-time database sync: refreshing page content');
      renderPage();
    });
  </script>
</body>
</html>
