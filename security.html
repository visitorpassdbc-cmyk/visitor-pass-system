<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Gate — VisitorPass System</title>
  <meta name="description" content="Scan and verify visitor passes at security entrance" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .security-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 900px) {
      .security-layout { grid-template-columns: 1fr; }
    }
    .scanner-window {
      background: #111126;
      border: 2px dashed var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      transition: var(--transition);
    }
    .scanner-window:hover {
      border-color: var(--accent-primary);
    }
    .scanner-laser {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-light), transparent);
      box-shadow: 0 0 12px var(--accent-primary);
      top: 10%;
      animation: scan-line 3s linear infinite;
    }
    @keyframes scan-line {
      0% { top: 10%; }
      50% { top: 90%; }
      100% { top: 10%; }
    }
    .camera-placeholder {
      font-size: 54px;
      margin-bottom: 16px;
    }
    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--glass-border);
      font-size: 13px;
    }
    .log-item:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside id="sidebar" class="sidebar"></aside>
    <main class="main-content">
      <div id="page-content"></div>
    </main>
  </div>
  <!-- Modal: Manual Input / Search -->
  <div class="modal-overlay" id="manual-modal">
    <div class="modal" style="max-width:480px">
      <div class="modal-header">
        <h2 class="modal-title">🔍 Find & Verify Visitor Pass</h2>
        <button class="modal-close" onclick="closeModal('manual-modal')">✕</button>
      </div>
      <form onsubmit="handleManualSearch(event)">
        <div class="form-group" style="margin-bottom:16px">
          <label class="form-label">Visitor Name, NIC, or Pass ID (අමුත්තාගේ නම, NIC හෝ Pass ID)</label>
          <input type="text" class="form-control" id="manual-pass-id" placeholder="e.g. Saman Kumara, 199012345678, or VIS-2026-0001" required />
          <small style="color:var(--text-muted);font-size:11px;margin-top:6px;display:block">
            You can enter visitor's full or partial name, NIC number, or Pass ID.
          </small>
        </div>
        <div style="display:flex;gap:12px;justify-content:flex-end">
          <button type="button" class="btn btn-outline" onclick="closeModal('manual-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Find & Verify</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentUser = VPS.requireAuth(['security']);
    let currentFilter = 'scan'; // scan or log
    let gateSearchTerm = '';
    let gateStatusFilter = 'all'; // all, expected, inside, out
    VPS.renderSidebar('dashboard');
    
    // Pull any new passes from backend on load
    VPS.syncWithBackend().then(() => {
      renderPage();
    });

    // Automatically verify pass if loaded with scan query parameter (e.g. security.html?scan=VIS-XXX)
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const scanId = urlParams.get('scan');
      if (scanId) {
        verifyPass(scanId.toUpperCase());
      }
    });

    function renderPage() {
      if (currentFilter === 'scan') {
        renderScanDashboard();
      } else {
        renderEntryLogs();
      }
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeNavId = currentFilter === 'scan' ? 'nav-scan' : 'nav-log';
      const activeNav = document.getElementById(activeNavId);
      if (activeNav) activeNav.classList.add('active');
    }

    function renderScanDashboard() {
      const allApproved = VPS.getAll().filter(r => r.status === VPS.STATUS.APPROVED);
      const expected = allApproved.filter(r => r.inTime === null);
      const inside = allApproved.filter(r => r.inTime !== null && r.outTime === null);
      const checkedOut = allApproved.filter(r => r.inTime !== null && r.outTime !== null);

      let tableRecords = allApproved;
      if (gateStatusFilter === 'expected') tableRecords = expected;
      else if (gateStatusFilter === 'inside') tableRecords = inside;
      else if (gateStatusFilter === 'out') tableRecords = checkedOut;

      if (gateSearchTerm) {
        const q = gateSearchTerm.trim().toLowerCase();
        tableRecords = tableRecords.filter(r => 
          (r.visitorName && r.visitorName.toLowerCase().includes(q)) ||
          (r.visitorNIC && r.visitorNIC.toLowerCase().includes(q)) ||
          (r.id && r.id.toLowerCase().includes(q)) ||
          (r.hostName && r.hostName.toLowerCase().includes(q)) ||
          (r.department && r.department.toLowerCase().includes(q)) ||
          (r.groupMembers && r.groupMembers.some(m => (m.name && m.name.toLowerCase().includes(q)) || (m.nic && m.nic.toLowerCase().includes(q))))
        );
      }
      
      document.getElementById('page-content').innerHTML = `
        <div class="page-header fade-in">
          <h1>Security Gate Control</h1>
          <p>Entrance Monitoring Desk · All Approved Visitor Passes Across All Divisions</p>
        </div>

        <!-- Quick Stats Overview -->
        <div class="stats-grid fade-in fade-in-delay-1" style="margin-bottom:20px">
          <div class="stat-card" style="cursor:pointer" onclick="setGateStatusFilter('all')">
            <div class="stat-icon">🎫</div>
            <div class="stat-value">${allApproved.length}</div>
            <div class="stat-label">Total Approved Passes</div>
          </div>
          <div class="stat-card" style="cursor:pointer" onclick="setGateStatusFilter('expected')">
            <div class="stat-icon">⏳</div>
            <div class="stat-value">${expected.length}</div>
            <div class="stat-label">Ready for Entry (Expected)</div>
          </div>
          <div class="stat-card" style="cursor:pointer" onclick="setGateStatusFilter('inside')">
            <div class="stat-icon">🟢</div>
            <div class="stat-value" style="color:var(--success)">${inside.length}</div>
            <div class="stat-label">Currently Inside Building</div>
          </div>
          <div class="stat-card" style="cursor:pointer" onclick="setGateStatusFilter('out')">
            <div class="stat-icon">🚪</div>
            <div class="stat-value" style="color:var(--text-muted)">${checkedOut.length}</div>
            <div class="stat-label">Checked Out</div>
          </div>
        </div>

        <!-- Real-time Quick Search Bar for Gate -->
        <div class="card fade-in fade-in-delay-1" style="margin-bottom:24px;border:1px solid rgba(139,92,246,0.35);background:rgba(139,92,246,0.06);padding:18px 20px">
          <label style="font-size:13px;font-weight:700;color:var(--accent-light);display:flex;align-items:center;gap:8px;margin-bottom:8px">
            🔍 Search Approved Visitors by Name / NIC / Pass ID (නමින් හෝ NIC අංකයෙන් පාස් සෙවීම)
          </label>
          <div style="display:flex;gap:10px;align-items:center">
            <input type="text" class="form-control" id="gate-quick-search" 
              placeholder="Type visitor name, NIC, or Pass ID... (අමුත්තාගේ නම හෝ හැඳුනුම්පත් අංකය ලියන්න)" 
              style="font-size:15px;padding:12px 16px;background:rgba(15,15,30,0.85);border-color:rgba(139,92,246,0.4)"
              oninput="handleLiveVisitorSearch(this.value)" value="${gateSearchTerm}" />
            <button class="btn btn-primary" onclick="verifySearchInput()" style="padding:12px 20px;white-space:nowrap">Verify</button>
            <button class="btn btn-outline btn-sm" onclick="openModal('manual-modal')" style="white-space:nowrap">⌨️ Key-In</button>
          </div>
        </div>

        <div class="security-layout fade-in fade-in-delay-2">
          <!-- Verification Scanner View -->
          <div class="card">
            <div class="card-header">
              <span class="card-title">📷 Entry Scanner Gate</span>
              <span class="badge" style="background:rgba(139,92,246,0.15);color:var(--accent-light)">Camera & QR</span>
            </div>
            
            <div class="scanner-window" id="scanner-area">
              <div id="reader" style="width: 100%; max-width: 320px; border-radius: var(--radius-md); overflow: hidden; display: none; margin-bottom: 16px;"></div>
              
              <div id="scanner-placeholder-content" style="display:flex; flex-direction:column; align-items:center; width:100%">
                <div class="scanner-laser"></div>
                <div class="camera-placeholder">🔲</div>
                <h3>Scan Visitor QR Code</h3>
                <p style="color:var(--text-muted);font-size:13px;margin:8px 0 16px;max-width:280px;text-align:center">
                  Position the visitor's digital or printed QR Pass in front of the camera, or search by name above.
                </p>
                
                <div class="form-group" style="width:100%;max-width:320px;text-align:left">
                  <label class="form-label" style="text-align:center;margin-bottom:8px">🧪 Simulator (Paste QR String or Name/NIC)</label>
                  <input type="text" class="form-control" id="qr-simulator" 
                    placeholder="Paste QR JSON, Name, NIC, or Pass ID..."
                    onpaste="simulatePasteScan(event)" onkeydown="if(event.key==='Enter') simulateEnterScan()" />
                  <button class="btn btn-primary btn-sm" style="width:100%;margin-top:8px" onclick="simulateEnterScan()">Verify Input</button>
                </div>
              </div>
              
              <button class="btn btn-success btn-sm" id="btn-toggle-camera" onclick="toggleCameraScanner()" style="width:100%;max-width:320px;margin-top:16px">📷 Start Camera Scanner</button>
            </div>
          </div>

          <!-- Result Indicator Section -->
          <div class="card" id="verification-result">
            <div class="empty-state" style="padding:40px 10px">
              <div class="empty-icon" style="font-size:64px">🎫</div>
              <h3>Awaiting Pass Verification</h3>
              <p>Scan a QR code, type a visitor's name in the search box above, or click any pass below to check approval status.</p>
            </div>
          </div>
        </div>

        <!-- Master Table: ALL Approved Passes Across All Divisions -->
        <div class="card fade-in fade-in-delay-3" style="margin-top:24px">
          <div class="card-header" style="flex-wrap:wrap;gap:12px">
            <div>
              <span class="card-title">📋 Approved Visitor Passes (සියලුම අනුමත පාස්)</span>
              <div style="font-size:12px;color:var(--text-muted);margin-top:2px">All corporate divisions · Gate clearance list</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn btn-sm ${gateStatusFilter === 'all' ? 'btn-primary' : 'btn-outline'}" onclick="setGateStatusFilter('all')">All (${allApproved.length})</button>
              <button class="btn btn-sm ${gateStatusFilter === 'expected' ? 'btn-primary' : 'btn-outline'}" onclick="setGateStatusFilter('expected')">Ready (${expected.length})</button>
              <button class="btn btn-sm ${gateStatusFilter === 'inside' ? 'btn-success' : 'btn-outline'}" onclick="setGateStatusFilter('inside')">Inside (${inside.length})</button>
              <button class="btn btn-sm ${gateStatusFilter === 'out' ? 'btn-primary' : 'btn-outline'}" onclick="setGateStatusFilter('out')">Out (${checkedOut.length})</button>
            </div>
          </div>

          <div class="table-wrapper">
            ${tableRecords.length === 0
              ? `<div class="empty-state" style="padding:32px"><div class="empty-icon">📭</div><h3>No matching approved passes</h3><p>${gateSearchTerm ? 'No visitors match your search term "' + gateSearchTerm + '".' : 'No approved passes currently in this view.'}</p></div>`
              : `<table>
                  <thead>
                    <tr>
                      <th>Pass ID</th>
                      <th>Visitor Name</th>
                      <th>NIC</th>
                      <th>Division</th>
                      <th>Host Officer</th>
                      <th>Visit Date & Time</th>
                      <th>Gate Status</th>
                      <th>Quick Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${tableRecords.map(r => {
                      const isInside = r.inTime !== null && r.outTime === null;
                      const isOut = r.inTime !== null && r.outTime !== null;
                      const isReady = r.inTime === null;
                      return `
                        <tr style="cursor:pointer" onclick="verifyPass('${r.id}'); window.scrollTo({top: 0, behavior: 'smooth'});">
                          <td><strong style="color:var(--accent-light);font-family:monospace">${r.id}</strong></td>
                          <td>
                            <strong>${r.visitorName}</strong>
                            ${r.groupMembers && r.groupMembers.length > 0 ? `<span class="badge" style="background:rgba(139,92,246,0.15);color:var(--accent-light);font-size:10px;padding:2px 6px;margin-left:6px;border:1px solid rgba(139,92,246,0.3)">+${r.groupMembers.length} group</span>` : ''}
                            <div style="font-size:11px;color:var(--text-muted)">${r.company || 'Individual'}</div>
                          </td>
                          <td>${r.visitorNIC}</td>
                          <td><span class="badge badge-primary" style="font-size:11px">${r.department}</span></td>
                          <td>${r.hostName}</td>
                          <td>
                            <div>${r.visitDate}</div>
                            <div style="font-size:11px;color:var(--text-muted)">${r.visitTime}</div>
                          </td>
                          <td>
                            ${isInside 
                              ? `<span class="badge" style="background:rgba(34,197,94,0.15);color:var(--success);border:1px solid rgba(34,197,94,0.3)">🟢 Inside Building</span>` 
                              : isOut 
                              ? `<span class="badge" style="background:rgba(148,163,184,0.15);color:var(--text-muted)">🚪 Checked Out</span>` 
                              : `<span class="badge badge-approved">⏳ Ready / Expected</span>`
                            }
                          </td>
                          <td>
                            ${isReady 
                              ? `<button class="btn btn-success btn-sm" onclick="checkinVisitor('${r.id}'); event.stopPropagation();">🟢 Check-In</button>`
                              : isInside 
                              ? `<button class="btn btn-danger btn-sm" onclick="checkoutVisitor('${r.id}'); event.stopPropagation();">🔴 Check-Out</button>`
                              : `<button class="btn btn-outline btn-sm" onclick="verifyPass('${r.id}'); event.stopPropagation();">View</button>`
                            }
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>`
            }
          </div>
        </div>
      `;
    }

    function setGateStatusFilter(filter) {
      gateStatusFilter = filter;
      renderScanDashboard();
    }

    function handleLiveVisitorSearch(val) {
      gateSearchTerm = val;
      renderScanDashboard();
      const input = document.getElementById('gate-quick-search');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function verifySearchInput() {
      const val = (document.getElementById('gate-quick-search')?.value || '').trim();
      if (val) verifyPass(val);
    }
    function renderEntryLogs() {
      const records = VPS.getAll().filter(r => r.inTime !== null);
      document.getElementById('page-content').innerHTML = `
        <div class="page-header fade-in">
          <h1>Entrance & Exit Logs</h1>
          <p>Logs of verified passes processed at this gate</p>
        </div>
        <div class="card fade-in fade-in-delay-1">
          <div class="card-header">
            <span class="card-title">📋 Entrance & Exit History Logs</span>
          </div>
          <div class="table-wrapper">
            ${records.length === 0
              ? `<div class="empty-state"><div class="empty-icon">📂</div><h3>No scan entries recorded</h3><p>Visitor entries scanned at the gate will show up here.</p></div>`
              : `<table>
                  <thead>
                    <tr>
                      <th>Pass ID</th>
                      <th>Visitor Name</th>
                      <th>NIC</th>
                      <th>Host / Dept</th>
                      <th>Check-In Time (In)</th>
                      <th>Check-Out Time (Out)</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${records.map(r => `
                      <tr>
                        <td>${r.id}</td>
                        <td>
                          <strong>${r.visitorName}</strong>
                          ${r.groupMembers && r.groupMembers.length > 0 ? `<span class="badge" style="background:rgba(139,92,246,0.15);color:var(--accent-light);font-size:10px;padding:2px 6px;margin-left:6px;border:1px solid rgba(139,92,246,0.3)">+${r.groupMembers.length} group</span>` : ''}
                        </td>
                        <td>${r.visitorNIC}</td>
                        <td>${r.hostName} (${r.department})</td>
                        <td>${VPS.formatDateTime(r.inTime)}</td>
                        <td>${VPS.formatDateTime(r.outTime)}</td>
                        <td>
                          ${r.outTime 
                            ? `<span class="badge badge-rejected" style="background:rgba(239, 68, 68, 0.1);color:var(--danger)">Checked Out</span>` 
                            : `<span class="badge badge-approved">Inside</span>`
                          }
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>`
            }
          </div>
        </div>
      `;
    }
    function handleManualSearch(event) {
      event.preventDefault();
      const passId = document.getElementById('manual-pass-id').value.trim().toUpperCase();
      closeModal('manual-modal');
      verifyPass(passId);
    }
    function simulatePasteScan(e) {
      setTimeout(() => {
        const val = document.getElementById('qr-simulator').value;
        verifyPass(val);
      }, 50);
    }
    function simulateEnterScan() {
      const val = document.getElementById('qr-simulator').value.trim();
      verifyPass(val);
    }
    function verifyPass(inputStr) {
      if (!inputStr) return;
      let record = null;
      // Extract pass ID if input is a URL
      if (inputStr.includes('?scan=')) {
        try {
          const urlParams = new URLSearchParams(inputStr.substring(inputStr.indexOf('?')));
          const scanId = urlParams.get('scan');
          if (scanId) {
            inputStr = scanId;
          }
        } catch(e) {
          console.error("Failed to parse scanned URL", e);
        }
      }
      // Check if scanner input is a JSON string (QR pass data payload)
      if (inputStr.startsWith('{') && inputStr.endsWith('}')) {
        try {
          const parsed = JSON.parse(inputStr);
          if (parsed && parsed.id) {
            record = VPS.getById(parsed.id);
          }
        } catch(e) {
          console.error("QR Code parsing failed", e);
        }
      }
      // If not parsed as JSON, query as direct pass ID
      if (!record) {
        record = VPS.getById(inputStr.trim().toUpperCase());
      }
      // Search by Visitor Name, NIC, or Group Member
      if (!record) {
        const query = inputStr.trim().toLowerCase();
        const allRecords = VPS.getAll();
        // Priority 1: Exact NIC match
        record = allRecords.find(r => r.visitorNIC && r.visitorNIC.trim().toLowerCase() === query);
        // Priority 2: Visitor Name match
        if (!record) {
          record = allRecords.find(r => r.visitorName && r.visitorName.toLowerCase().includes(query));
        }
        // Priority 3: Group member match
        if (!record) {
          record = allRecords.find(r => r.groupMembers && r.groupMembers.some(m => 
            (m.name && m.name.toLowerCase().includes(query)) || 
            (m.nic && m.nic.toLowerCase() === query)
          ));
        }
      }
      const resDiv = document.getElementById('verification-result');
      if (!resDiv) return;
      if (!record) {
        resDiv.innerHTML = `
          <div class="gate-status denied">
            <div class="gate-icon">❌</div>
            <h2>ACCESS DENIED</h2>
            <p>No pass found matching "<strong>${inputStr}</strong>". Please verify the Visitor's Name or NIC Number.</p>
          </div>
          <div style="text-align:center;margin-top:16px">
            <button class="btn btn-outline" onclick="resetGateScanner()">Clear Result</button>
          </div>
        `;
        resDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        VPS.showNotification('Pass Verification Failed! Record not found.', 'error');
        return;
      }
      // Record exists, display details
      const isApproved = record.status === VPS.STATUS.APPROVED;
      resDiv.innerHTML = `
        <div class="gate-status ${isApproved ? 'allowed' : 'denied'}">
          <div class="gate-icon">${isApproved ? '🟢' : '🔴'}</div>
          <h2>${isApproved ? 'ENTRY APPROVED' : 'ENTRY DENIED'}</h2>
          <p>${isApproved ? 'Authorized by Administration' : 'Pass Status: ' + record.status.toUpperCase()}</p>
        </div>
        <div class="card" style="margin-top:16px;background:rgba(255,255,255,0.02)">
          <div class="detail-row"><span class="detail-label">Pass ID</span><span class="detail-value">${record.id}</span></div>
          <div class="detail-row"><span class="detail-label">Visitor Name</span><span class="detail-value">${record.visitorName}</span></div>
          <div class="detail-row"><span class="detail-label">NIC / Passport</span><span class="detail-value">${record.visitorNIC}</span></div>
          <div class="detail-row"><span class="detail-label">Phone</span><span class="detail-value">${record.visitorPhone}</span></div>
          <div class="detail-row"><span class="detail-label">Visit Department</span><span class="detail-value">${record.department}</span></div>
          <div class="detail-row"><span class="detail-label">Host Officer</span><span class="detail-value">${record.hostName}</span></div>
          <div class="detail-row"><span class="detail-label">Purpose</span><span class="detail-value">${record.purpose}</span></div>
          <div class="detail-row"><span class="detail-label">Date & Time</span><span class="detail-value">${record.visitDate} @ ${record.visitTime}</span></div>
          <div class="detail-row"><span class="detail-label">Submitted By</span><span class="detail-value">${record.submittedByName || 'Requester'}</span></div>
          ${record.inTime ? `<div class="detail-row" style="color:var(--success)"><span class="detail-label">Check-In Time</span><span class="detail-value">${VPS.formatDateTime(record.inTime)}</span></div>` : ''}
          ${record.outTime ? `<div class="detail-row" style="color:var(--danger)"><span class="detail-label">Check-Out Time</span><span class="detail-value">${VPS.formatDateTime(record.outTime)}</span></div>` : ''}
          ${record.groupMembers && record.groupMembers.length > 0 ? `
            <div style="margin-top:12px; border-top:1px dashed var(--glass-border); padding-top:12px">
              <div style="font-weight:700; color:var(--warning); font-size:13px; margin-bottom:8px">👥 Group Members (${record.groupMembers.length}):</div>
              <div style="display:flex; flex-direction:column; gap:6px">
                ${record.groupMembers.map((m, idx) => `
                  <div style="background:rgba(139,92,246,0.06); padding:8px 12px; border-radius:6px; border:1px solid rgba(139,92,246,0.15); font-size:12px">
                    <strong style="color:var(--text-primary)">${idx+1}. ${m.name}</strong>
                    ${m.nic ? `<span style="color:var(--text-muted); margin-left:8px">NIC: ${m.nic}</span>` : ''}
                    ${m.phone ? `<span style="color:var(--text-muted); margin-left:8px">📞 ${m.phone}</span>` : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
        <div style="display:flex;gap:12px;margin-top:20px;justify-content:center">
          ${isApproved && !record.inTime
            ? `<button class="btn btn-success" onclick="checkinVisitor('${record.id}')">🟢 Confirm Entry (Check-In)</button>`
            : isApproved && record.inTime && !record.outTime
            ? `<button class="btn btn-danger" onclick="checkoutVisitor('${record.id}')">🔴 Confirm Exit (Check-Out)</button>`
            : `<button class="btn btn-outline" onclick="resetGateScanner()">Close</button>`
          }
        </div>
      `;
      resDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function checkinVisitor(id) {
      VPS.recordCheckIn(id);
      VPS.showNotification('Visitor check-in entry logged.', 'success');
      resetGateScanner();
    }
    function checkoutVisitor(id) {
      VPS.recordCheckOut(id);
      VPS.showNotification('Visitor check-out exit logged.', 'warning');
      resetGateScanner();
    }
    function resetGateScanner() {
      stopCameraScanner();
      renderPage();
    }
    function changeFilter(filterName) {
      stopCameraScanner();
      currentFilter = filterName;
      renderPage();
    }
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    let html5QrCode = null;
    function toggleCameraScanner() {
      const readerDiv = document.getElementById('reader');
      const placeholder = document.getElementById('scanner-placeholder-content');
      const btn = document.getElementById('btn-toggle-camera');
      
      if (!html5QrCode) {
        // Start scanner
        if (readerDiv) readerDiv.style.display = 'block';
        if (placeholder) placeholder.style.display = 'none';
        if (btn) {
          btn.textContent = '❌ Stop Camera Scanner';
          btn.className = 'btn btn-danger btn-sm';
        }
        
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };
        
        html5QrCode.start(
          { facingMode: "environment" }, 
          config, 
          (decodedText) => {
            verifyPass(decodedText);
            stopCameraScanner();
          },
          (errorMessage) => {
            // Quietly ignore scan errors
          }
        ).catch(err => {
          console.error("Camera access failed:", err);
          VPS.showNotification("Unable to access camera. Please check permissions.", "error");
          stopCameraScanner();
        });
      } else {
        stopCameraScanner();
      }
    }
    
    function stopCameraScanner() {
      const readerDiv = document.getElementById('reader');
      const placeholder = document.getElementById('scanner-placeholder-content');
      const btn = document.getElementById('btn-toggle-camera');
      
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode = null;
          if (readerDiv) readerDiv.style.display = 'none';
          if (placeholder) placeholder.style.display = 'flex';
          if (btn) {
            btn.textContent = '📷 Start Camera Scanner';
            btn.className = 'btn btn-success btn-sm';
          }
        }).catch(err => {
          console.error("Failed to stop scanner", err);
          html5QrCode = null;
          // Fallback cleanup
          if (readerDiv) readerDiv.style.display = 'none';
          if (placeholder) placeholder.style.display = 'flex';
          if (btn) {
            btn.textContent = '📷 Start Camera Scanner';
            btn.className = 'btn btn-success btn-sm';
          }
        });
      }
    }

    // Intercept SPA navigation links
    document.addEventListener('click', function(e) {
      const navItem = e.target.closest('.nav-item');
      if (navItem && navItem.getAttribute('href').startsWith('#')) {
        e.preventDefault();
        const tab = navItem.getAttribute('href').slice(1);
        if (tab === 'scan') changeFilter('scan');
        if (tab === 'log') changeFilter('log');
      }
    });
    // Real-time data sync listener
    window.addEventListener('vps-data-updated', () => {
      console.log('Real-time database sync: refreshing page content');
      renderPage();
    });
  </script>
</body>
</html>
